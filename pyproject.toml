[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "slot-ledger"
version = "0.1.0"
description = "Auditable publisher-yield analysis with SQL, market-mix decomposition and an offline review dashboard."
requires-python = ">=3.11"
dependencies = ["duckdb==2.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
slot-ledger = "slot_ledger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
slot_ledger = ["sql/*.sql", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
